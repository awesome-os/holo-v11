name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage _site with dashboard and live telemetry
        run: |
          rm -rf _site
          mkdir -p _site _site/reports
          cp -r dashboard/* _site/
          if [ ! -f _site/index.html ] && [ -f dashboard/oversight.html ]; then
            cp dashboard/oversight.html _site/index.html
          fi
          cp reports/gravity-telemetry.json _site/gravity-telemetry.json
          cp reports/gravity-telemetry.json _site/reports/gravity-telemetry.json
          if [ -f reports/oversight-telemetry.json ]; then
            cp reports/oversight-telemetry.json _site/oversight-telemetry.json
            cp reports/oversight-telemetry.json _site/reports/oversight-telemetry.json
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
