name: Sync Global Holo v11 Registry

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-holo-v11-registry:
    name: Sync Global v11 CAS Manifest & Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout awesome-os/holo-v11
        uses: actions/checkout@v7
        with:
          path: holo-v11

      - name: Checkout awesome-os/awesome-os (verified-boot Ed25519 signer)
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: awesome-os/awesome-os
          path: awesome-os
          sparse-checkout: |
            security/verified-boot.mts

      - name: Checkout awesome-os/t2linux-baseline (upstream pin catalogs)
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: awesome-os/t2linux-baseline
          path: t2linux-baseline
          sparse-checkout: |
            catalog

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Stream-hash all awesome-os/* releases into Global v11 CAS manifest & emit gravity telemetry
        working-directory: holo-v11
        env:
          GH_TOKEN: ${{ github.token }}
          AWESOME_OS_ORG: awesome-os
          MAX_ASSET_MB: '250'
        run: |
          node scripts/warm-global-cas.mts
          node scripts/v11-tree-overrides.mts
          node scripts/v11-scope-tags.mts
          node scripts/gravity-pin-dedup-telemetry.mts
          node scripts/collect-oversight-telemetry.mts

      - name: Commit updated v11 index manifests & telemetry reports to main
        working-directory: holo-v11
        run: |
          git config user.name "awesome-os-cas-bot"
          git config user.email "cas@awesome-os.com"
          if ! git diff --quiet -- index/ reports/ 2>/dev/null || [ -n "$(git status --porcelain index/ reports/)" ]; then
            git add index/ reports/gravity-telemetry.json reports/gravity-telemetry.ndjson reports/oversight-telemetry.json
            git commit -m "chore(v11-index): sync global holo v11 CAS manifests, overrides, scope tags & gravity telemetry"
            git push origin HEAD:main
          else
            echo "index/ and reports/ unchanged — skipping empty commit."
          fi
